<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            margin: 0;
            padding: 20px;
        }

        .header {
            background: #cfeef8;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 16px;
        }

        .card {
            background: #f5f5f5;
            max-width: 640px;
            margin: 0 auto;
            padding: 20px;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: bold;
        }

        input[type=text],
        input[type=email],
        input[type=tel],
        input[type=password],
        input[type=file] {
            width: 100%;
            padding: 8px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type=submit] {
            margin-top: 14px;
            padding: 10px 16px;
            border-radius: 6px;
            border: 0;
            background: #007acc;
            color: #fff;
            cursor: pointer;
            font-size: 15px;
        }

        input[type=submit]:hover {
            background: #005fa3;
        }

        small[data-error] {
            color: red;
            display: block;
            height: 18px;
            margin-top: 4px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h1 class="header">JOB APPLICATION FORM</h1>
    <form class="card" id="jobForm">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required>
        <small data-error="name"></small>

        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required>
        <small data-error="email"></small>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" required>
        <small data-error="phone"></small>

        <label for="position">Position Applied For:</label>
        <input type="text" id="position" name="position" required>
        <small data-error="position"></small>

        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx" required>
        <small data-error="resume"></small>

        <label for="password">Create Password:</label>
        <input type="password" id="password" name="password" required>
        <small data-error="password"></small>

        <label for="confirm_password">Confirm Password:</label>
        <input type="password" id="confirm_password" name="confirm_password" required>
        <small data-error="confirm"></small>

        <input type="submit" value="Submit Application">
    </form>

    <script>
        const form = document.getElementById('jobForm');

        
        form.onsubmit = function (e) {
            e.preventDefault();
            let valid = true;
            document.querySelectorAll('small[data-error]').forEach(s => s.textContent = '');

            const fullname = document.getElementById('fullname').value.trim();
            if (fullname === "") {
                document.querySelector('small[data-error="name"]').textContent = "Full name is required.";
                valid = false;
            }

            const email = document.getElementById('email').value.trim();
            const emailPattern = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
            if (!emailPattern.test(email)) {
                document.querySelector('small[data-error="email"]').textContent = "Enter a valid email.";
                valid = false;
            }

            const phone = document.getElementById('phone').value.trim();
            if (!/^\d{10}$/.test(phone)) {
                document.querySelector('small[data-error="phone"]').textContent = "Enter a 10-digit phone number.";
                valid = false;
            }

            const position = document.getElementById('position').value.trim();
            if (position === "") {
                document.querySelector('small[data-error="position"]').textContent = "Position is required.";
                valid = false;
            }

            const resumeInput = document.getElementById('resume');
            if (!resumeInput.files || resumeInput.files.length === 0) {
                document.querySelector('small[data-error="resume"]').textContent = "Please upload your resume.";
                valid = false;
            }

            const password = document.getElementById('password').value;
            if (password.length < 6) {
                document.querySelector('small[data-error="password"]').textContent = "Password must be at least 6 characters.";
                valid = false;
            }

            const confirm = document.getElementById('confirm_password').value;
            if (password !== confirm) {
                document.querySelector('small[data-error="confirm"]').textContent = "Passwords do not match.";
                valid = false;
            }

            if (valid) {
                alert("Application submitted successfully!");
                form.reset();
            }
        };
    </script>
</body>
</html>
